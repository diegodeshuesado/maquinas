<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="version" content="__VERSION__">
<script>
/* si hay una versión más nueva publicada, recarga una vez para no quedarse con la copia vieja del navegador */
(function () {
  function revisar() {
  var v = document.querySelector('meta[name=version]').content;
  if (v.indexOf('__') === 0 || !window.fetch) return;
  fetch('version.txt?' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : ''; })
    .then(function (t) {
      t = t.trim();
      try { if (!t || t === v || sessionStorage.getItem('maquinas_recarga') === t) return; sessionStorage.setItem('maquinas_recarga', t); } catch (e) { return; }
      var u = new URL(location.href); u.searchParams.set('v', t); location.replace(u.toString());
    })
    .catch(function () {});
  }
  revisar();
  /* al regresar con «atrás», Safari muestra la página guardada sin volver a revisar */
  window.addEventListener('pageshow', function (e) { if (e.persisted) revisar(); });
})();
</script>

<title>galería · máquinas_</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=__VERSION__">
</head>
<body>
<div class="envoltura">
  <header class="cabeza">
    <a class="marca" href="./">máquinas_</a>
    <nav>
      <a href="./">inicio</a>
      <a href="galeria.html" aria-current="page">galería</a>
    </nav>
  </header>

  <div id="vista-carpetas">
    <h1 style="font-size:clamp(28px,5vw,44px)">galería_</h1>
    <p class="sub">elige una carpeta_</p>
    <div class="carpetas galeria" id="carpetas"></div>
  </div>

  <div id="vista-maquina" hidden>
    <a class="volver" href="galeria.html">← galería</a>
    <div class="titulo-carpeta">
      <svg viewBox="0 0 150 104" aria-hidden="true"><path d="M2 16 V102 H148 V16 H62 L50 2 H2 Z" fill="none" stroke="#141414" stroke-width="6" stroke-linejoin="round"/></svg>
      <h1 id="nombre-maquina"></h1>
    </div>
    <p class="sub" id="conteo-maquina"></p>
    <div class="vista-toggle" id="vista-toggle" hidden>
      <button class="herr on" type="button" data-vista="rejilla">cuadrícula</button>
      <button class="herr" type="button" data-vista="mapa">mapa</button>
    </div>
    <div id="mapa-galeria" hidden></div>
    <p class="ayuda" id="nota-mapa" hidden></p>
    <div class="rejilla" id="rejilla"></div>
    <p class="mensaje" id="estado-galeria"></p>
    <p id="participar" hidden style="margin-top:36px"><a class="boton" href="#">participar en esta máquina_ →</a></p>
  </div>

  <p class="licencia">piezas bajo <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.es" rel="license">CC BY-NC-SA 4.0</a></p>

  <footer class="pie-sitio">máquinas_ · Diego Deshuesado</footer>
</div>

<div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="pieza ampliada">
  <button class="boton cerrar" id="cerrar">cerrar_ ×</button>
  <img id="visor-img" alt="" decoding="async">
  <p style="text-align:center;font-size:13px"><a id="visor-original" href="#" target="_blank" rel="noopener">ver en resolución completa_</a></p>
</div>

<script>
(async () => {
  const MAQUINAS = [
    { id: 'constelaciones_urbanas', nombre: 'constelacio-<br>nes_urbanas', instructivo: 'constelaciones_urbanas.html' },
    { id: 'un_pueblo_feliz', nombre: 'un_pue-<br>blo_feliz' },
    { id: 'poe_arqui_lecturas', nombre: 'poe_arqui_<br>lecturas', instructivo: 'poe_arqui_lecturas.html' },
    { id: 'anar_quitecturas', nombre: 'anar_quitec-<br>turas', instructivo: 'anar_quitecturas.html', mapa: true },
    { id: 'no_poesia', nombre: 'no_poe-<br>sía' },
    { id: 'ficciones_de_mi_barrio', nombre: 'ficciones_-<br>de_mi_barrio', instructivo: 'ficciones_de_mi_barrio.html' },
  ];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const plural = (n) => `${n} ${n === 1 ? 'pieza' : 'piezas'}`;
  const carpeta = '<svg viewBox="0 0 150 104" aria-hidden="true"><path d="M2 16 V102 H148 V16 H62 L50 2 H2 Z" fill="none" stroke="#141414" stroke-width="2.2" stroke-linejoin="round"/><path d="M2 16 H62" stroke="#141414" stroke-width="2.2"/></svg>';

  let piezas = [];
  try {
    const r = await fetch('envios/index.json', { cache: 'no-store' });
    piezas = r.ok ? await r.json() : [];
  } catch { $('estado-galeria').textContent = 'no se pudo cargar la galería.'; }

  const elegida = MAQUINAS.find((m) => m.id === new URLSearchParams(location.search).get('maquina'));

  if (!elegida) {
    // ── vista de carpetas ──
    $('carpetas').innerHTML = MAQUINAS.map((m) => {
      const n = piezas.filter((p) => p.maquina === m.id).length;
      const activa = n > 0;
      const tag = activa ? 'a' : 'div';
      const href = activa ? ` href="galeria.html?maquina=${m.id}"` : '';
      return `<${tag} class="carpeta ${activa ? 'activa' : 'inactiva'}"${href}>
        ${carpeta}<span class="nombre">${m.nombre}</span>
        <span class="estado">${activa ? `${plural(n)}_ →` : (m.instructivo ? 'aún sin piezas_' : 'próximamente_')}</span>
      </${tag}>`;
    }).join('');
  } else {
    // ── carpeta abierta ──
    $('vista-carpetas').hidden = true;
    $('vista-maquina').hidden = false;
    const lista = piezas.filter((p) => p.maquina === elegida.id);
    $('nombre-maquina').textContent = elegida.id;
    document.title = `${elegida.id} · galería · máquinas_`;
    $('conteo-maquina').textContent = plural(lista.length);
    if (elegida.instructivo) { $('participar').hidden = false; $('participar').querySelector('a').href = elegida.instructivo; }
    if (!lista.length) $('estado-galeria').textContent = 'aún no hay piezas aprobadas_ sé la primera persona en participar.';
    $('rejilla').innerHTML = lista.map((p) => `
      <button class="pieza" data-src="${esc(p.grande || p.imagen)}" data-original="${esc(p.imagen)}" data-alt="${esc(p.titulo)}">
        <img src="${esc(p.mini || p.imagen)}" alt="${esc(p.titulo)}" loading="lazy" decoding="async">
        <span class="datos"><strong>${esc(p.titulo)}</strong>${esc(p.alias || 'anónimo')}${p.ciudad ? ' · ' + esc(p.ciudad) : ''} · ${esc(p.fecha)}</span>
      </button>`).join('');
  }

  // ── visor ──
  const visor = $('visor'), vimg = $('visor-img'), original = $('visor-original');
  const abrir = (p) => { vimg.src = p.grande || p.imagen; vimg.alt = p.titulo || ''; original.href = p.imagen; visor.classList.add('abierto'); };
  $('rejilla').addEventListener('click', (e) => {
    const b = e.target.closest('.pieza'); if (!b) return;
    vimg.src = b.dataset.src; vimg.alt = b.dataset.alt; original.href = b.dataset.original; visor.classList.add('abierto');
  });

  // ── mapa de la carpeta (máquinas con ubicación) ──
  if (elegida && elegida.mapa) {
    const conLugar = piezas.filter((p) => p.maquina === elegida.id && Number.isFinite(p.lat) && Number.isFinite(p.lng));
    if (conLugar.length) {
      $('vista-toggle').hidden = false;
      let mapa = null;
      const cargar = (tag, attrs) => new Promise((ok, mal) => { const el = document.createElement(tag); Object.assign(el, attrs); el.onload = ok; el.onerror = mal; document.head.appendChild(el); });
      const verMapa = async () => {
        if (!window.L) {
          await cargar('link', { rel: 'stylesheet', href: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css' });
          await cargar('script', { src: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js' });
        }
        if (mapa) { mapa.invalidateSize(); return; }
        document.body.classList.add('mapa-gris');
        mapa = L.map('mapa-galeria');
        mapa.attributionControl.setPrefix(false);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(mapa);
        const marcas = conLugar.map((p) => L.marker([p.lat, p.lng], {
          title: p.titulo,
          icon: L.divIcon({ className: 'marca-foto', html: `<img src="${esc(p.mini || p.imagen)}" alt="${esc(p.titulo)}">`, iconSize: [46, 46] }),
        }).on('click', () => abrir(p)).addTo(mapa));
        mapa.fitBounds(L.featureGroup(marcas).getBounds().pad(0.3), { maxZoom: 16 });
      };
      const sinLugar = piezas.filter((p) => p.maquina === elegida.id).length - conLugar.length;
      $('vista-toggle').addEventListener('click', async (e) => {
        const b = e.target.closest('[data-vista]'); if (!b) return;
        const esMapa = b.dataset.vista === 'mapa';
        document.querySelectorAll('[data-vista]').forEach((x) => x.classList.toggle('on', x === b));
        $('rejilla').hidden = esMapa; $('mapa-galeria').hidden = !esMapa;
        $('nota-mapa').hidden = !esMapa || !sinLugar;
        $('nota-mapa').textContent = sinLugar ? `${plural(sinLugar)} sin ubicación: solo en la cuadrícula.` : '';
        if (esMapa) { try { await verMapa(); } catch { $('estado-galeria').textContent = 'el mapa no cargó; revisa tu conexión.'; } }
      });
    }
  }
  const cerrar = () => visor.classList.remove('abierto');
  $('cerrar').addEventListener('click', cerrar);
  visor.addEventListener('click', (e) => { if (e.target === visor) cerrar(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') cerrar(); });
})();
</script>
</body>
</html>
