name: explorar fuentes
on:
  push:
    branches: [explorar]
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - name: sharepoint
        continue-on-error: true
        run: |
          T=IQB62zi8YeCOR5sJgXLRXNoTAc0815g0LPL0OhuUPy9Z_ec
          U="https://sspcgob-my.sharepoint.com/:u:/g/personal/cni_sspc_gob_mx/$T?e=8lbU4f"
          curl -sSL -c c.txt -b c.txt -A "Mozilla/5.0" -o a.html -w "share %{http_code} %{url_effective}\n" "$U"
          grep -oE '"(downloadUrl|\.downloadUrl|FileUrlNoAuth|fileUrl|serverRedirectedUrl)"\s*:\s*"[^"]{0,300}' a.html | head -5
          grep -oE '<title>[^<]*' a.html; grep -oiE '(sign in|iniciar sesi|access denied|acceso)[^<]{0,80}' a.html | head -3
          D="https://sspcgob-my.sharepoint.com/personal/cni_sspc_gob_mx/_layouts/15/download.aspx?share=$T"
          curl -sSL -c c.txt -b c.txt -A "Mozilla/5.0" -o d.bin -w "download %{http_code} %{content_type} %{size_download} %{url_effective}\n" "$D"
          file d.bin; unzip -l d.bin 2>/dev/null | head; head -c 200 d.bin | tr -d '\0'; echo
          curl -sSL -A "Mozilla/5.0" -o e.bin -w "download sin cookie %{http_code} %{content_type} %{size_download}\n" "$D"; file e.bin
