# Publica el sitio en GitHub Pages cada vez que algo entra a main
# (incluido cuando apruebas un envío con Merge). Antes de publicar, regenera el índice de la galería.
name: publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 15 * * 1'   # cada lunes: revisa si el SESNSP publicó cifras nuevas (un_pueblo_feliz)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: miniaturas de la galería
        run: |
          pip install --quiet pillow
          python scripts/miniaturas.py
      - name: cifras de un_pueblo_feliz (SESNSP + datos/cifras_manual.json)
        run: |
          python scripts/cifras.py || echo "no se pudieron actualizar las cifras; se publica la versión guardada"
          if ! git diff --quiet -- datos/cifras.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add datos/cifras.json
            git commit -m "cifras: actualización automática"
            git pull --rebase --quiet origin main && git push --quiet origin HEAD:main || echo "no se pudo guardar el commit de cifras (se publica igual)"
          fi
      - name: índice de la galería
        run: node scripts/indice.mjs
      - name: sello de versión (evita que los navegadores se queden con copias viejas)
        run: |
          V="${GITHUB_SHA::7}"
          sed -i "s/__VERSION__/$V/g" *.html
          echo "$V" > version.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
